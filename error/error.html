<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="../static/img/index-img/seal.jpg">
    <title>The Brown Family | Page Not Found</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="../static/css/blog.css">
    <!-- Error Page CSS -->
    <link rel="stylesheet" href="error.css">
    <script src="../static/js/layout.js" defer></script>
</head>
<body>

    <!-- Premium Navigation Header (Dynamic Component) -->
    <blog-nav depth="1"></blog-nav>

    <!-- Main Content -->
    <main class="content-container" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 60px 24px; min-height: calc(100vh - var(--navbar-height) - 150px);">
        <div class="card error-card">
            <!-- Premium 404 Visual containing the Seal -->
            <div class="error-visual">
                <span class="digit">4</span>
                <div class="seal-glow-ring">
                    <img class="error-seal" src="../static/img/index-img/seal.jpg" alt="0" />
                </div>
                <span class="digit">4</span>
            </div>
            
            <h1 class="error-title">Oops! Page Not Found</h1>
            <p class="error-message">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            
            <div class="action-buttons">
                <a href="../index.html" class="btn btn-primary">Go to Homepage</a>
                <a href="../templates/contact.html" class="btn btn-secondary">Contact Support</a>
            </div>
        </div>
    </main>

    <!-- Premium Footer -->
    <footer>
        <div class="footer-container">
            <div class="footer-info">
                <h4>More Info</h4>
                <p>Information about sources and the site</p>
                <p>&copy; Copyright 2026 The Brown Family | T.C. Brown</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="../static/js/main.js"></script>
    <script src="error.js"></script>
</body>
</html>
