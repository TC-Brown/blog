<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Brands Tracker</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #2ed573;
            --dark: #2f3542;
            --light: #f1f2f6;
            --white: #ffffff;
            /* Rarity Colors */
            --color-common: #2ed573;
            --color-rare-ur: #1e90ff;
            --color-lux-iconic: #ff4757;
            --color-legendary: #ffa502;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #ff6b81, #ff4757);
            color: var(--white);
            padding: 40px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* Stats Dashboard */
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            font-weight: bold;
        }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background-color: var(--white);
            color: var(--dark);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: var(--white);
        }

        /* Search Bar Styles */
        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid #ced6e0;
            border-radius: 25px;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        /* Rarity Key Styles */
        .key-container {
            background-color: var(--white);
            max-width: 850px;
            margin: 0 auto 30px auto;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .key-title {
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #747d8c;
        }

        .key-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Key Shape Generators */
        .shape {
            display: inline-block;
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .shape.common {
            background-color: var(--color-common);
        }

        .shape.rare {
            border: 2px solid var(--color-rare-ur);
            border-radius: 50%;
        }

        .shape.ultra-rare {
            background-color: var(--color-rare-ur);
            border-radius: 50%;
        }

        .shape.luxury {
            border: 2px solid var(--color-lux-iconic);
            transform: rotate(45deg);
            width: 11px;
            height: 11px;
            margin: 0 2px;
        }

        .shape.iconic {
            background-color: var(--color-lux-iconic);
            transform: rotate(45deg);
            width: 11px;
            height: 11px;
            margin: 0 2px;
        }

        .shape.legendary {
            color: var(--color-legendary);
            font-size: 18px;
            line-height: 14px;
            height: 14px;
            width: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Collection Grid */
        .collection-container {
            display: none;
        }

        .collection-container.active {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        /* Item Cards */
        .mini-card {
            background: var(--white);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid transparent;
        }

        .mini-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .mini-img-placeholder {
            width: 100%;
            height: 120px;
            background-color: #dfe4ea;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a4b0be;
            font-size: 0.9rem;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .mini-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .mini-rarity {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #747d8c;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Action Buttons */
        .card-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid #ced6e0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            background: var(--white);
            transition: all 0.2s;
        }

        /* Card States */
        .mini-card.owned {
            border-color: var(--secondary);
            background-color: #f1fcf4;
        }
        .mini-card.owned .btn-owned {
            background-color: var(--secondary);
            color: var(--white);
            border-color: var(--secondary);
        }

        .mini-card.wishlist {
            border-color: #ffa502;
            background-color: #fffaf1;
        }
        .mini-card.wishlist .btn-wish {
            background-color: #ffa502;
            color: var(--white);
            border-color: #ffa502;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mini Brands / Mini Verse</h1>
        <p>Select a Collection below to track your minis!</p>
        <div class="stats-container">
            <div class="stat-card">Total Owned: <span id="total-owned">0</span></div>
            <div class="stat-card">Wishlist Items: <span id="total-wishlist">0</span></div>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('fridge')">Fill The Fridge</button>
        <button class="tab-btn" onclick="switchTab('home')">Home Collection</button>
    </div>

    <!-- Search Input Option -->
    <div class="search-container">
        <input type="text" id="search-bar" class="search-input" placeholder="Search by name or rarity..." onkeyup="filterCollection()">
    </div>

    <!-- Rarity Key Indicator -->
    <div class="key-container">
        <span class="key-title">Rarity Key:</span>
        <div class="key-item"><span class="shape common"></span> Common</div>
        <div class="key-item"><span class="shape rare"></span> Rare</div>
        <div class="key-item"><span class="shape ultra-rare"></span> Ultra Rare</div>
        <div class="key-item"><span class="shape luxury"></span> Luxury</div>
        <div class="key-item"><span class="shape iconic"></span> Iconic</div>
        <div class="key-item"><span class="shape legendary">★</span> Legendary</div>
    </div>

    <!-- Fill The Fridge Section -->
    <div id="fridge-grid" class="collection-container active"></div>

    <!-- Home Section -->
    <div id="home-grid" class="collection-container"></div>

    <script>
        // Sample Data Structure for the Mini Brands items
        const collectionData = {
            fridge: [
                { id: 'f1', name: 'Kikkoman Soy Sauce', rarity: 'Common'},
                { id: 'f2', name: 'Lea & Perrins Worcestershire Sauce', rarity: 'Common'},
                { id: 'f3', name: 'Kraft Italian Dressing', rarity: 'Common'},
                { id: 'f4', name: 'Philadelphia Cream Cheese', rarity: 'Common'},
                { id: 'f5', name: 'Cool Whip Whipped Topping', rarity: 'Common'},
                { id: 'f6', name: 'Kraft Singles American Cheese', rarity: 'Common'},
                { id: 'f7', name: 'Hershey\'s Chocolate Syrup', rarity: 'Common'},
                { id: 'f8', name: 'Hershey\'s Strawberry Syrup', rarity: 'Common'},
                { id: 'f9', name: 'Peperami', rarity: 'Common'},
                { id: 'f10', name: 'Ore-Ida Crispy Tater Tots', rarity: 'Common'},
                { id: 'f11', name: 'Ore-Ida Shredded Hash Browns', rarity: 'Common'},
                { id: 'f12', name: 'Bagel Bites', rarity: 'Common'},
                { id: 'f13', name: 'Pizza Hut Cheese Pizza', rarity: 'Common'},
                { id: 'f14', name: 'Pizza Hut Hawaiian Pizza', rarity: 'Common'},
                { id: 'f15', name: 'Pizza Hut Pepperoni Pizza', rarity: 'Common'},
                { id: 'f16', name: 'Pizza Hut Big Dinner Box', rarity: 'Common'},
                { id: 'f17', name: 'Pizza Hut Wings', rarity: 'Common'},
                { id: 'f18', name: 'Tumeric Shot', rarity: 'Common'},
                { id: 'f19', name: 'Kombucha', rarity: 'Common'},
                { id: 'f20', name: 'Milk', rarity: 'Common'},
                { id: 'f21', name: 'Juice', rarity: 'Common'},
                { id: 'f22', name: 'Water', rarity: 'Common'},
                { id: 'f23', name: 'Broccoli', rarity: 'Common'},
                { id: 'f24', name: 'Fruit Tray', rarity: 'Common'},
                { id: 'f25', name: 'Eggplant', rarity: 'Common'},
                { id: 'f26', name: 'Oats', rarity: 'Common'},
                { id: 'f27', name: 'Lamb Chops', rarity: 'Common'},
                { id: 'f28', name: 'Fish', rarity: 'Common'},
                { id: 'f29', name: 'Lobster', rarity: 'Common'},
                { id: 'f30', name: 'Hormel Mac and Cheese', rarity: 'Rare'},
                { id: 'f31', name: 'Hormel Mashed Potatoes', rarity: 'Rare'},
                { id: 'f32', name: 'Morning Star Sausage Patties', rarity: 'Rare'},
                { id: 'f33', name: 'Hormel Honey Deli Ham', rarity: 'Rare'},
                { id: 'f34', name: 'Hormel Oven Rosted Deli Turkey', rarity: 'Rare'},
                { id: 'f35', name: 'Eggo Homestyle Waffles', rarity: 'Rare'},
                { id: 'f36', name: 'Hormel Black Label Applewood Bacon', rarity: 'Rare'},
                { id: 'f37', name: 'Hormel Black Label Original Bacon', rarity: 'Rare'},
                { id: 'f38', name: 'Auntie Anne\'s Soft Pretzels', rarity: 'Rare'},
                { id: 'f39', name: 'Auntie Anne\'s Pretzel Dogs', rarity: 'Rare'},
                { id: 'f40', name: 'Jell-O Strawberry', rarity: 'Rare'},
                { id: 'f41', name: 'Jell-O Vanilla Pudding Cups', rarity: 'Rare'},
                { id: 'f42', name: 'Jell-o Chocolate Vanilla Swirl Pudding Cups', rarity: 'Rare'},
                { id: 'f43', name: 'Kraft Mayo', rarity: 'Rare'},
                { id: 'f44', name: 'Kraft Hickory Smoked BBQ Sauce', rarity: 'Rare'},
                { id: 'f45', name: 'Ramune Orange Soda', rarity: 'Ultra Rare'},
                { id: 'f46', name: 'Ramune Original Soda', rarity: 'Ultra Rare'},
                { id: 'f47', name: 'Ramune Strawberry Soda', rarity: 'Ultra Rare'},
                { id: 'f48', name: 'Olipop Tropical Punch', rarity: 'Ultra Rare'},
                { id: 'f49', name: 'Olipop Classic Grape', rarity: 'Ultra Rare'},
                { id: 'f50', name: 'Mike\'s Hot Honey', rarity: 'Ultra Rare'},
                { id: 'f51', name: 'Panda Express Fried Rice', rarity: 'Ultra Rare'},
                { id: 'f52', name: 'Panda Express Beef and Broccoli', rarity: 'Ultra Rare'},
                { id: 'f53', name: 'Panda Express Orange Chicken', rarity: 'Ultra Rare'},
                { id: 'f54', name: 'Baskin Robbins Jamoca Almond Fudge', rarity: 'Ultra Rare'},
                { id: 'f55', name: 'Baskin Robbins Oreos Cookies and Cream', rarity: 'Ultra Rare'},
                { id: 'f56', name: 'IHOP Short Stack Pancakes', rarity: 'Luxury'},
                { id: 'f57', name: 'IHOP Burger and Fries', rarity: 'Luxury'},
                { id: 'f58', name: 'Baskin Robbins Unicorn Cake', rarity: 'Luxury'},
                { id: 'f59', name: 'Sushi', rarity: 'Luxury'},
                { id: 'f60', name: 'Eggs', rarity: 'Luxury'},
                { id: 'f61', name: 'Chicken', rarity: 'Luxury'},
                { id: 'f62', name: 'Tiramisu {Create}', rarity: 'Luxury'},
                { id: 'f63', name: 'Ice', rarity: 'Luxury'},
                { id: 'f64', name: 'Ramune Original {Mini}', rarity: 'Iconic'},
                { id: 'f65', name: 'Hershey\'s Chocolate Syrup {Mini}', rarity: 'Iconic'},
                { id: 'f66', name: 'Olipop Strawberry Soda {Mini}', rarity: 'Iconic'},
                { id: 'f67', name: 'Baskin Robbins Oreos Cookies and Cream {Mini}', rarity: 'Iconic'},
                { id: 'f68', name: 'Ice Pops {Create}', rarity: 'Legendary'},
                { id: 'f69', name: 'Flan {Create}', rarity: 'Legendary'},
            ],
            home: [
                { id: 'h1', name: 'Item Name', rarity: 'Common' },
                { id: 'h2', name: 'Item Name', rarity: 'Rare' },
                { id: 'h2', name: 'Item Name', rarity: 'Ultra Rare' },
                { id: 'h2', name: 'Item Name', rarity: 'Luxury' },
                { id: 'h2', name: 'Item Name', rarity: 'Iconic' },
                { id: 'h2', name: 'Item Name', rarity: 'Legendary' }

            ]
        };

        // Current active category tab
        let activeCategory = 'fridge';

        // Object to keep track of user's inventory status in localStorage
        let userInventory = JSON.parse(localStorage.getItem('miniBrandsInventory')) || {};

        // Switch between Fridge and Home tabs
        function switchTab(tabName) {
            activeCategory = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.collection-container').forEach(grid => grid.classList.remove('active'));

            // Clear search field when moving between tabs
            document.getElementById('search-bar').value = '';

            if (tabName === 'fridge') {
                document.getElementById('fridge-grid').classList.add('active');
            } else {
                document.getElementById('home-grid').classList.add('active');
            }
            event.target.classList.add('active');
            
            // Reset filters to show all items in the new tab
            filterCollection();
        }

        // Helper function to map rarity string to HTML shape element
        function getRarityShapeHTML(rarity) {
            const formattedRarity = rarity.toLowerCase().replace(/\s+/g, '-').replace(/\{.*\}/, '').trim();
            if (formattedRarity === 'legendary') {
                return `<span class="shape legendary">★</span>`;
            }
            return `<span class="shape ${formattedRarity}"></span>`;
        }

        // Render cards dynamically into the HTML
        function renderCollection(category, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            collectionData[category].forEach(item => {
                const status = userInventory[item.id] || 'none'; // owned, wishlist, or none
                const shapeHTML = getRarityShapeHTML(item.rarity);
                
                const card = document.createElement('div');
                card.className = `mini-card ${status !== 'none' ? status : ''}`;
                card.id = `card-${item.id}`;

                card.innerHTML = `
                    <div class="mini-img-placeholder">✨ MINI IMAGE</div>
                    <div class="mini-name">${item.name}</div>
                    <div class="mini-rarity">${shapeHTML} ${item.rarity}</div>
                    <div class="card-actions">
                        <button class="action-btn btn-owned" onclick="toggleStatus('${item.id}', 'owned')">Got It</button>
                        <button class="action-btn btn-wish" onclick="toggleStatus('${item.id}', 'wishlist')">Want It</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Search logic to filter item visibility on the fly
        function filterCollection() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const items = collectionData[activeCategory];

            items.forEach(item => {
                const card = document.getElementById(`card-${item.id}`);
                const matchesName = item.name.toLowerCase().includes(query);
                const matchesRarity = item.rarity.toLowerCase().includes(query);

                if (matchesName || matchesRarity) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Handle button clicks to change item collection state
        function toggleStatus(itemId, targetStatus) {
            const currentStatus = userInventory[itemId] || 'none';
            const card = document.getElementById(`card-${itemId}`);

            // If clicking the same button that is active, reset it to 'none'
            if (currentStatus === targetStatus) {
                userInventory[itemId] = 'none';
                card.classList.remove('owned', 'wishlist');
            } else {
                userInventory[itemId] = targetStatus;
                card.classList.remove('owned', 'wishlist');
                card.classList.add(targetStatus);
            }

            // Save progress and update counters
            localStorage.setItem('miniBrandsInventory', JSON.stringify(userInventory));
            updateStats();
        }

        // Calculate and update dashboard tracking numbers
        function updateStats() {
            let ownedCount = 0;
            let wishlistCount = 0;

            Object.values(userInventory).forEach(status => {
                if (status === 'owned') ownedCount++;
                if (status === 'wishlist') wishlistCount++;
            });

            document.getElementById('total-owned').innerText = ownedCount;
            document.getElementById('total-wishlist').innerText = wishlistCount;
        }

        // Initialize App
        renderCollection('fridge', 'fridge-grid');
        renderCollection('home', 'home-grid');
        updateStats();
    </script>
</body>
</html>
